name: Windows foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npm run build
      - run: npm run smoke
